
spring.application.name=usuarios-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/pagoflex_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=usuarios-service:8082

springdoc.swagger-ui.path=/swagger-ui.html
