spring.application.name=soporte-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/pagoflex_soporte?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${PAGOFLEX_DB_USER:root}
spring.datasource.password=${PAGOFLEX_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

server.error.include-message=always

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=soporte-service:8084

springdoc.swagger-ui.path=/swagger-ui.html
usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8082}
cobranza.service.url=${COBRANZA_SERVICE_URL:http://localhost:8083}
pagoflex.internal.key=${PAGOFLEX_INTERNAL_KEY:pagoflex-solo-desarrollo-local}
